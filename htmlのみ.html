<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>休憩</title>
</head>
<body>

    <header>
        <h1>休憩-relax-</h1>
    </header>

    <main>
        
        <!-- 1. リラックスミュージック -->
        <section>
            <label for="music-select">リラックスミュージック：</label>
            <select id="music-select">
                <option value="none">癒されミュージック</option>
                <option value="rain.mp3"> 1.氷雪の森林</option>
                <option value="waves.mp3">🌊 2. 穏やかな寄せる波の音</option>
                <option value="fire.mp3">🔥 3. パチパチ揺れる焚き火の音</option>
                <option value="birds.mp3">🐦 4. 鳥のさえずり・森の音</option>
                <option value="bowl.mp3">🧘 5. 瞑想用シンギングボウル</option>
            </select>
            <button id="play-btn" type="button">再生</button>

            <!-- 音量バー（初期状態は非表示） -->
            <div id="volume-container" style="display: none;">
                <label for="volume-slider">音量：</label>
                <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.5">
            </div>

            <!-- BGM再生用オーディオ要素 -->
            <audio id="bgm-player" loop></audio>
            <!-- タイマー終了音用オーディオ要素 -->
            <audio id="alarm-player" src="alarm.mp3"></audio>
        </section>

        <hr>

        <!-- 2. 休憩時間を決める -->
        <section>
            <div>
                <span>休憩時間を決める：</span>
                <button type="button" onclick="setTimer(3)">3分</button>
                <button type="button" onclick="setTimer(5)">5分</button>
                <button type="button" onclick="setTimer(10)">10分</button>
                
                <select id="custom-time" onchange="setCustomTimer(this.value)">
                    <option value="" disabled selected>選択▽</option>
                    <option value="1">1分</option>
                    <option value="15">15分</option>
                    <option value="20">20分</option>
                    <option value="30">30分</option>
                </select>
            </div>

            <!-- カウントダウンタイマー表示 -->
            <div id="timer-box">
                <h2 id="timer-display">00:00</h2>
                <div>
                    <button id="timer-start-btn" type="button" onclick="toggleTimer()">スタート</button>
                    <button type="button" onclick="resetTimer()">リセット</button>
                </div>
            </div>
        </section>

        <hr>

        <!-- 3. イライラを書き出すMEMO -->
        <section>
            <label for="memo-input" style="display: block;">イライラを書き出すMEMO</label>
            <div id="memo-wrapper">
                <textarea id="memo-input" rows="5" cols="50" placeholder="（例）なんでこんなの辛い。"></textarea>
            </div>
            <div>
                <button type="button" onclick="purgeMemo()">リセット</button>
            </div>
        </section>

        <hr>

        <!-- 4. ミニゲームはこちら -->
        <section>
            <span>ミニゲームはこちら：</span>
            <a href="game.html">ミニゲームへ移動する</a>
        </section>

    </main>

    <!-- JavaScript ロジック -->
    <script>
        /* -------------------------------------------------------------
           1. MP3音源の再生・停止・音量変更
        ------------------------------------------------------------- */
        const musicSelect = document.getElementById('music-select');
        const playBtn = document.getElementById('play-btn');
        const volumeContainer = document.getElementById('volume-container');
        const volumeSlider = document.getElementById('volume-slider');
        const bgmPlayer = document.getElementById('bgm-player');
        const alarmPlayer = document.getElementById('alarm-player');

        // ドロップダウン選択時の処理
        musicSelect.addEventListener('change', () => {
            if (musicSelect.value === 'none') {
                stopSound();
                volumeContainer.style.display = 'none';
            } else {
                volumeContainer.style.display = 'block';
                bgmPlayer.src = musicSelect.value; // 選択されたMP3ファイルをセット
                if (!bgmPlayer.paused) {
                    bgmPlayer.play();
                }
            }
        });

        // 再生/一時停止ボタンの処理
        playBtn.addEventListener('click', () => {
            if (musicSelect.value === 'none') {
                alert('リラックスミュージックを選択してください。');
                return;
            }
            if (bgmPlayer.paused) {
                playSound();
            } else {
                stopSound();
            }
        });

        // 音量スライダーの処理
        volumeSlider.addEventListener('input', (e) => {
            bgmPlayer.volume = e.target.value;
        });

        function playSound() {
            if (musicSelect.value !== 'none') {
                bgmPlayer.src = musicSelect.value;
                bgmPlayer.volume = volumeSlider.value;
                bgmPlayer.play();
                playBtn.textContent = '一時停止';
            }
        }

        function stopSound() {
            bgmPlayer.pause();
            playBtn.textContent = '再生';
        }

        /* -------------------------------------------------------------
           2. 休憩時間タイマー
        ------------------------------------------------------------- */
        let timerInterval = null;
        let totalSeconds = 0;
        let remainingSeconds = 0;
        let isTimerRunning = false;

        const timerDisplay = document.getElementById('timer-display');
        const timerStartBtn = document.getElementById('timer-start-btn');

        function updateDisplay() {
            const mins = Math.floor(remainingSeconds / 60);
            const secs = remainingSeconds % 60;
            timerDisplay.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function setTimer(minutes) {
            pauseTimer();
            totalSeconds = minutes * 60;
            remainingSeconds = totalSeconds;
            document.getElementById('custom-time').value = "";
            updateDisplay();
        }

        function setCustomTimer(minutes) {
            if (!minutes) return;
            setTimer(parseInt(minutes));
        }

        function toggleTimer() {
            if (remainingSeconds <= 0) return;
            if (isTimerRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        function startTimer() {
            if (isTimerRunning || remainingSeconds <= 0) return;
            isTimerRunning = true;
            timerStartBtn.textContent = '一時停止';

            timerInterval = setInterval(() => {
                remainingSeconds--;
                updateDisplay();

                if (remainingSeconds <= 0) {
                    pauseTimer();
                    alarmPlayer.play(); // 時間終了時にアラームMP3を再生
                }
            }, 1000);
        }

        function pauseTimer() {
            isTimerRunning = false;
            clearInterval(timerInterval);
            timerStartBtn.textContent = 'スタート';
        }

        function resetTimer() {
            pauseTimer();
            remainingSeconds = totalSeconds;
            updateDisplay();
        }

        /* -------------------------------------------------------------
           3. メモ消去処理
        ------------------------------------------------------------- */
        function purgeMemo() {
            document.getElementById('memo-input').value = '';
        }

        window.onload = () => {
            setTimer(3);
        };
    </script>
</body>
</html>
