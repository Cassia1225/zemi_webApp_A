<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>休憩</title>
    <link rel="stylesheet" href="../../css/relax.css">
</head>
<body>

    <header>
        <h1>休憩-relax-</h1>
    </header>

    <main>
        
        <!-- 1. リラックスミュージック -->
        <section>
            <label for="music-select">リラックスミュージック：</label>
            <select id="music-select">
                <!--<option value="none">癒されミュージック</option>-->
                <option value="../../../assets/music/rain.mp3"> 🌧️ 1.雨の音</option>
                <option value="../../../assets/music/waves.mp3">🌊 2. 海辺、波の音</option>
                <option value="../../../assets/music/tanbo.mp3">🌙 3. 秋の夜、虫の声</option>
                <option value="../../../assets/music/birds.mp3">🐦 4. 鳥のさえずり</option>
                <option value="../../../assets/music/zattou.mp3">🏙️ 5. 街の雑踏</option>
                <option value="../../../assets/music/music_1.mp3">🎹 6. ピアノリラックス1</option>
                <option value="../../../assets/music/music_2.mp3">🎹 7. ピアノリラックス2</option>
                
            </select>
            <button id="play-btn" type="button">再生</button>

            <!-- 音量バー（初期状態は非表示） -->
            <div id="volume-container" style="display: none;">
                <label for="volume-slider">音量：</label>
                <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.5">
            </div>

            <!-- BGM再生用オーディオ要素 -->
            <audio id="bgm-player" loop></audio>
            <!-- タイマー終了音用オーディオ要素 -->
            <audio id="alarm-player" src="alarm.mp3"></audio>
        </section>

        <hr>

        <!-- 2. 休憩時間を決める -->
        <section>
            <div>
                <span>休憩時間を決める：</span>
                <button type="button" onclick="setTimer(3)">3分</button>
                <button type="button" onclick="setTimer(5)">5分</button>
                <button type="button" onclick="setTimer(10)">10分</button>
                
                <select id="custom-time" onchange="setCustomTimer(this.value)">
                    <option value="" disabled selected>選択</option>
                    <option value="1">1分</option>
                    <option value="15">15分</option>
                    <option value="20">20分</option>
                    <option value="30">30分</option>
                </select>
            </div>

            <!-- カウントダウンタイマー表示 -->
            <div id="timer-box">
                <h2 id="timer-display">00:00</h2>
                <div>
                    <button id="timer-start-btn" type="button" onclick="toggleTimer()">スタート</button>
                    <button type="button" onclick="resetTimer()">リセット</button>
                </div>
            </div>
        </section>

        <hr>

        <!-- 3. イライラを書き出すMEMO -->
        <section>
            <label for="memo-input" style="display: block;">イライラを書き出すMEMO</label>
            <div id="memo-wrapper">
                <textarea id="memo-input" rows="5" cols="50" placeholder="（例）なんでこんなの辛い。"></textarea>
            </div>
            <div>
                <button type="button" onclick="purgeMemo()">リセット</button>
            </div>
        </section>

        <hr>

        <!-- 4. ミニゲームはこちら -->
        <section>
            <span>ミニゲームはこちら：</span>
            <a href="game.html">ミニゲームへ移動する</a>
        </section>

    </main>

    <!-- JavaScript ロジックの読み込み -->
    <script src="relax.js"></script>
</body>
</html>
