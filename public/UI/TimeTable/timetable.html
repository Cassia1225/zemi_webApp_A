<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>時間割</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@500;700&display=swap" />
  <link rel="stylesheet" href="../../css/timetable.css" />
</head>

<body class="timetable">
  <div class="wrap">

    <!-- ヘッダー -->
    <header>
      <div class="title-group">
        <!-- 年度の選択メニュー(各年度の右端の ✎ で名前変更。中身は timetable.js の renderHeader が作る) -->
        <div class="year-dd">
          <button type="button" class="btn-mode-select year-btn" id="yearBtn" aria-label="年度選択" aria-haspopup="true" onclick="toggleYearMenu()"></button>
          <div class="year-menu" id="yearMenu"></div>
        </div>
        <h1 id="appTitle">時間割</h1>
      </div>

      <button class="btn btn-danger delete-btn" id="deleteConfirmBtn" onclick="deleteSelected()" disabled>
        講義をタップして<wbr>削除する
      </button>

      <div class="header-actions">
        <button class="btn btn-primary" onclick="openExchangeModal()">送信/受信</button>
        <select class="btn-mode-select" aria-label="モード選択" onchange="setMode(this.value)">
          <option value="view">講義確認・登録</option>
          <option value="delete">講義削除</option>
        </select>
      </div>
    </header>

    <div id="saveError">保存に失敗しました。もう一度お試しください。</div>
    

    <!-- 時間割の表 -->
    <div class="grid-stage">
      <button class="nav-arrow" id="prevBtn" aria-label="前の時間割" onclick="step(-1)">&lt;</button>
      <div class="grid-scroll" id="gridScroll">
      </div>
      <button class="nav-arrow" id="nextBtn" aria-label="次の時間割" onclick="step(1)">&gt;</button>
    </div>

  </div>

  <!-- 講義の登録・編集 -->
  <div class="modal-overlay" id="overlay">
    <div class="modal">
      <h2 id="modalTitle">講義を登録</h2>

      <div class="field">クォーター
        <div class="chips" id="qRow"></div>
      </div>

      <div class="field">
        <div class="slots-head">
          <span>曜日・時限</span>
          <button class="btn-link" onclick="addSlot()">＋ コマを追加</button>
        </div>
        <div class="slots-list" id="slotsList"></div>
      </div>

      <label class="field">講義名
        <input id="fName" placeholder="講義" />
        <div class="form-error" id="fNameError" style="display:none">講義名を入力してください</div>
      </label>

      <label class="field">講師名
        <input id="fTeacher" placeholder="講師" />
      </label>

      <label class="field">場所
        <input id="fRoom" placeholder="場所" />
      </label>

      <div class="field">色
        <div class="color-row" id="colorRow"></div>
      </div>

      <div class="modal-actions">
        <button class="btn btn-danger" id="deleteBtn" onclick="deleteFromForm()">削除</button>
        <div style="display:flex; gap:8px">
          <button class="btn btn-ghost" onclick="closeModal('overlay')">キャンセル</button>
          <button class="btn btn-primary" onclick="saveForm()">保存</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 講義の詳細 -->
  <div class="modal-overlay" id="viewOverlay">
    <div class="modal lg">
      <div class="view-course-name" id="viewName"></div>

      <div class="view-course-meta">
        <div class="view-meta-row"><span class="view-meta-label">講師</span><span id="viewTeacher"></span></div>
        <div class="view-meta-row"><span class="view-meta-label">場所</span><span id="viewRoom"></span></div>
        <div class="view-meta-row"><span class="view-meta-label">時間</span><span id="viewTime"></span></div>
      </div>

      <div class="modal-actions" style="margin-top:18px">
        <button class="btn btn-danger" onclick="deleteViewing()">講義削除</button>
        <div style="display:flex; gap:8px">
          <button class="btn btn-ghost" onclick="closeModal('viewOverlay')">閉じる</button>
          <button class="btn btn-primary" onclick="editViewing()">講義編集</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 送信/受信モーダル(タブで切り替え) -->
  <div class="modal-overlay" id="exchangeOverlay">
    <div class="modal lg">
      <div class="tab-row">
        <button class="tab-btn on" id="tabSend" onclick="showExchangeTab('send')">送信</button>
        <button class="tab-btn" id="tabReceive" onclick="showExchangeTab('receive')">受信</button>
      </div>

      <!-- 送信タブ -->
      <div id="sendPane">
        <div class="field">あなたのユーザID(仮)
          <div class="share-id-row">
            <span class="share-my-id" id="myIdText"></span>
            <button class="btn btn-ghost" onclick="copyMyId(this)">コピー</button>
          </div>
        </div>

        <div class="field">あなたの表示名(相手に見える名前)
          <input id="myName" placeholder="山田 太郎" maxlength="30" />
        </div>

        <div class="field">送りたい相手のユーザID
          <input id="toId" placeholder="例 U-3C9D1X" maxlength="8" />
          <button type="button" class="btn btn-ghost contact-btn" id="contactBtn" style="display:none;" onclick="openContactModal()"></button>
          <div id="selectedList"></div>
        </div>

        <div class="field">送る年度
          <div class="chips" id="sendYearRow"></div>
        </div>

        <div class="field">送るクォーター
          <div class="chips" id="sendQRow"></div>
        </div>

        <div class="send-msg" id="sendMsg"></div>

        <div class="modal-actions">
          <button class="btn btn-ghost" onclick="closeModal('exchangeOverlay')">閉じる</button>
          <button class="btn btn-primary" onclick="executeSend()">送信する</button>
        </div>
      </div>

      <!-- 受信タブ(誰から届いたか → 名前をタップで時間割を表示。表示のみ) -->
      <div id="receivePane" style="display:none;">
        <div id="receiveContent"></div>
        <div class="modal-actions" style="margin-top:18px;">
          <span></span>
          <button class="btn btn-ghost" onclick="closeModal('exchangeOverlay')">閉じる</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ユーザ一覧(送る相手をチェックボックスで選ぶ) -->
  <div class="modal-overlay" id="contactOverlay">
    <div class="modal">
      <h2>送信先を選択</h2>
      <div id="contactList"></div>
      <div class="modal-actions" style="margin-top:18px;">
        <button class="btn btn-ghost" onclick="closeModal('contactOverlay')">キャンセル</button>
        <button class="btn btn-primary" onclick="applyContacts()">決定</button>
      </div>
    </div>
  </div>

  <!-- 年度の追加(西暦を入力) -->
  <div class="modal-overlay" id="addYearOverlay">
    <div class="modal">
      <h2>年度を追加</h2>
      <label class="field">西暦(4桁)
        <input id="addYearInput" type="text" inputmode="numeric" maxlength="4" placeholder="例 2027"
               onkeydown="if (event.key === 'Enter') applyYearAdd()" />
        <div class="form-error" id="addYearError" style="display:none">2000〜2100の西暦4桁で入力してください</div>
      </label>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeModal('addYearOverlay')">キャンセル</button>
        <button class="btn btn-primary" onclick="applyYearAdd()">追加</button>
      </div>
    </div>
  </div>

  <!-- 年度の名前変更(空にすると「2026年度」の表示に戻る) -->
  <div class="modal-overlay" id="renameYearOverlay">
    <div class="modal">
      <h2>年度の名前を変更</h2>
      <label class="field">
        <input id="renameYearInput" maxlength="20" aria-label="年度の表示名"
               onkeydown="if (event.key === 'Enter') applyYearRename()" />
      </label>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeModal('renameYearOverlay')">キャンセル</button>
        <button class="btn btn-primary" onclick="applyYearRename()">保存</button>
      </div>
    </div>
  </div>

  <script src="timetable.js"></script>
</body>
</html>
