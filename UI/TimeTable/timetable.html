<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>時間割</title>
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@500;700&display=swap"
  />
  <link rel="stylesheet" href="../../css/timetable.css" />
</head>

<body class="timetable">
  <div class="wrap">

    <!-- ヘッダー:タイトル / 削除ボタン / メニュー・モード切替 -->
    <header>
      <h1 id="appTitle">時間割</h1>

      <button
        class="btn btn-danger delete-btn"
        id="deleteConfirmBtn"
        onclick="deleteSelected()"
        disabled
      >
        講義をタップして<wbr>削除する
      </button>

      <div class="header-actions">
        <div class="menu-wrap">
          <button class="btn-menu" aria-label="メニューを開く" onclick="setMenu(!menuOpen)">☰</button>
          <div id="patternMenu" class="pattern-menu"></div>
        </div>

        <select class="btn-mode-select" aria-label="モード選択" onchange="setMode(this.value)">
          <option value="view">講義確認・登録</option>
          <option value="delete">講義削除</option>
        </select>
      </div>
    </header>

    <div id="saveError">保存に失敗しました。もう一度お試しください。</div>
    <div id="loading" class="loading">読み込み中…</div>

    <!-- 時間割の表(左右の矢印・スワイプで1Q〜4Qを切り替え) -->
    <div class="grid-stage">
      <button class="nav-arrow" id="prevBtn" aria-label="前の時間割" onclick="step(-1)">&lt;</button>

      <div class="grid-scroll" id="gridScroll">
        <div id="grid" class="grid" style="display:none"></div>
      </div>

      <button class="nav-arrow" id="nextBtn" aria-label="次の時間割" onclick="step(1)">&gt;</button>
    </div>

  </div>

  <!-- ===== 講義の登録・編集 ===== -->
  <div class="modal-overlay" id="overlay" onclick="if (event.target === this) show(this.id, 0)">
    <div class="modal">
      <h2 id="modalTitle">講義を登録</h2>

      <div class="field">
        <div class="slots-head">
          <span>曜日・時限</span>
          <button class="btn-link" onclick="addSlot()">＋ コマを追加</button>
        </div>
        <div class="slots-list" id="slotsList"></div>
      </div>

      <label class="field">
        講義名
        <input id="fName" placeholder="線形空間論" />
        <div class="form-error" id="fNameError" style="display:none">講義名を入力してください</div>
      </label>

      <label class="field">
        講師名
        <input id="fTeacher" placeholder="山田 太郎" />
      </label>

      <label class="field">
        教室 / 場所
        <input id="fRoom" placeholder="37-705 / オンデマンド" />
      </label>

      <div class="field">
        色
        <div class="color-row" id="colorRow"></div>
      </div>

      <div class="modal-actions">
        <div>
          <button
            class="btn btn-danger"
            id="deleteBtn"
            onclick="deleteCourses([draft.id]); show('overlay', 0)"
          >
            削除
          </button>
        </div>
        <div style="display:flex; gap:8px">
          <button class="btn btn-ghost" onclick="show('overlay', 0)">キャンセル</button>
          <button class="btn btn-primary" onclick="saveForm()">保存</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== 講義の詳細 ===== -->
  <div class="modal-overlay" id="viewOverlay" onclick="if (event.target === this) show(this.id, 0)">
    <div class="modal lg">
      <div class="view-course-name" id="viewName"></div>

      <div class="view-course-meta">
        <div class="view-meta-row">
          <span class="view-meta-label">講師</span>
          <span id="viewTeacher"></span>
        </div>
        <div class="view-meta-row">
          <span class="view-meta-label">場所</span>
          <span id="viewRoom"></span>
        </div>
        <div class="view-meta-row">
          <span class="view-meta-label">時間</span>
          <span id="viewTime"></span>
        </div>
      </div>

      <div class="modal-actions" style="margin-top:18px">
        <div>
          <button class="btn btn-danger" onclick="deleteViewing()">講義削除</button>
        </div>
        <div style="display:flex; gap:8px">
          <button class="btn btn-ghost" onclick="show('viewOverlay', 0)">閉じる</button>
          <button class="btn btn-primary" onclick="show('viewOverlay', 0); openForm(viewing)">講義編集</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== 設定(時限の時間) ===== -->
  <div class="modal-overlay" id="settingsOverlay" onclick="if (event.target === this) show(this.id, 0)">
    <div class="modal">
      <h2>設定</h2>

      <div class="field" style="margin-bottom:6px">
        <span>時限の時間</span>
      </div>
      <div class="settings-periods-list" id="periodsList"></div>

      <div class="modal-actions" style="justify-content:flex-end; margin-top:16px">
        <button class="btn btn-ghost" onclick="show('settingsOverlay', 0)">閉じる</button>
      </div>
    </div>
  </div>

  <!-- onclick 属性から関数を呼ぶため、type="module" は付けない -->
  <script src="timetable.js"></script>
</body>
</html>
